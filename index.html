<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Accordingly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one column, a case file read under a lamp. A stage with the people on top, the story below,
   court-paper slips and the real case documents for the law. Single warm world: wedding red, marigold for emphasis. */
:root {
  --ground: #5a1c25;
  --panel: #6d2430;
  --raise: #82303d;
  --line: #a24c59;
  --fg: #fff4ee;
  --muted: #f2d3d3;
  --gold: #f6bd47;
  --stagebg: #3b1218;
  --paper: #f6ecd9;
  --paper-ink: #2a1c18;
  --paper-rule: #c9b89b;
  --ok: #7fd3a8;
  --display: "Gloock", "DM Serif Display", Georgia, serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--ground); color: var(--fg); }
body { font-family: var(--body); font-size: 17.5px; line-height: 1.6; margin: 0; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.hud { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
  font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-bottom: 12px; }
.hud .name { color: var(--fg); font-weight: 600; }
.hud nav { display: flex; gap: 16px; margin-left: auto; }
.linkbtn { background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--muted); font: inherit; letter-spacing: inherit;
  text-transform: inherit; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:hover, .linkbtn:focus-visible { color: var(--gold); outline: none; }

.ledger { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 18px; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--muted);
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 9px 2px; margin-bottom: 14px; font-variant-numeric: tabular-nums; }
.ledger .counts { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.ledger b { color: var(--fg); font-weight: 600; }
.ledger .law b { color: var(--gold); }
.meter { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.meter .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.meter .fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width .9s ease, background .4s; }
.meter .fill.empty { background: #ff6b6b; }
.meter .fill.full { background: var(--ok); }
.meter .pct { color: var(--fg); font-weight: 600; min-width: 3.6em; text-align: right; }

.thread { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; margin-bottom: 14px; }
.thread span { font-family: var(--mono); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
  border-top: 3px solid var(--line); padding-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thread span.done { color: var(--fg); border-color: var(--fg); }
.thread span.now { color: var(--fg); border-color: var(--gold); }

.stage { position: relative; border-radius: 8px 8px 0 0; overflow: hidden; background: var(--stagebg); aspect-ratio: 16 / 7; max-width: 100%; }
.stage svg { display: block; width: 100%; height: 100%; animation: fadein .6s ease both; }
.stage .cap { position: absolute; left: 10px; top: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; background: rgba(59,18,24,.88); color: var(--fg); padding: 4px 8px; border-radius: 3px; }
.tick { animation: tick 1s steps(1) infinite; }
@keyframes tick { 50% { opacity: .35; } }
.glow { animation: glow 2.4s ease-in-out infinite; }
@keyframes glow { 50% { opacity: .45; } }

.story { background: var(--panel); border-radius: 0 0 8px 8px; padding: 24px 26px 28px; }
.story.solo { border-radius: 8px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.08; text-wrap: balance; }
h1 { font-size: clamp(48px, 12vw, 84px); margin: 4px 0 10px; }
h2 { font-size: clamp(30px, 6.5vw, 44px); margin: 6px 0 6px; }
h3 { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 26px 0 10px; }
.meta { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
p { margin: 0 0 14px; max-width: 62ch; }
.lede { font-size: 19px; }
.note { font-size: 14.5px; color: var(--muted); }
.reveal > * { animation: rise .5s ease both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes rise { from { opacity: .15; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fadein { from { opacity: .4; } to { opacity: 1; } }

.motto { margin: 0 0 18px; padding: 10px 14px; border-left: 3px solid var(--gold); background: var(--raise); font-family: var(--display); font-size: 21px; line-height: 1.3; max-width: 58ch; }
.motto .th { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.motto .tr { display: block; font-family: var(--body); font-style: italic; font-size: 14.5px; color: var(--muted); margin-top: 4px; }

.choices { display: grid; gap: 10px; margin-top: 22px; }
.choice { display: flex; gap: 14px; align-items: baseline; text-align: left; background: var(--raise); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; font: inherit; cursor: pointer; transition: transform .15s, border-color .15s; }
.choice .k { font-family: var(--mono); font-weight: 600; color: var(--gold); font-size: 14px; flex: none; width: 18px; }
.choice:hover, .choice:focus-visible { border-color: var(--gold); transform: translateY(-1px); outline: none; }
.keyhint { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 10px; }

.primary { background: var(--fg); color: #6d1a26; border: 0; border-radius: 6px; padding: 13px 22px; font: 600 16px var(--body); cursor: pointer; }
.primary:hover { background: var(--gold); }
.primary:disabled { opacity: .45; cursor: default; background: var(--fg); }
.primary:focus-visible, .ghost:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 18px; font: inherit; cursor: pointer; }
.ghost:hover { border-color: var(--gold); }
.foot { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; align-items: center; }

.chosen { font-family: var(--mono); font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--gold); padding-left: 10px; margin-bottom: 16px; }
.voice { position: relative; background: var(--raise); border-radius: 10px; padding: 14px 16px; margin: 20px 0 18px; font-style: italic; max-width: 58ch; }
.voice::before { content: ""; position: absolute; left: 22px; top: -8px; border: 8px solid transparent; border-top: 0; border-bottom-color: var(--raise); }
.voice .who { display: block; font-style: normal; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }

.slip { background: var(--paper); color: var(--paper-ink); border-radius: 2px; padding: 16px 18px 8px; margin-top: 20px; font-size: 15px; line-height: 1.55; transform: rotate(-.35deg); }
.slip .head { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: #8f1f24; border-bottom: 1px dashed var(--paper-rule); padding-bottom: 6px; margin-bottom: 10px; }
.slip p { margin: 0 0 10px; }
.slip q { font-style: italic; }
.slip .src { display: block; font-family: var(--mono); font-size: 11.5px; opacity: .72; margin-top: 3px; }
.slip.reform { background: #e6f5ec; color: #12321f; }
.slip.reform .head { color: #12603a; border-color: #9cc9ad; }

.doc { margin: 18px 0; display: grid; justify-items: center; gap: 6px; }
.doc button { background: none; border: 0; padding: 0; cursor: zoom-in; max-width: 100%; }
.doc img { display: block; width: min(320px, 100%); height: auto; border-radius: 2px; box-shadow: 0 10px 30px rgba(0,0,0,.35); transform: rotate(-1.2deg); transition: width .3s; }
.doc.big img { width: min(620px, 100%); transform: none; }
.doc.big button { cursor: zoom-out; }
.doc .dcap { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; }
.doc button:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

.verdictbox { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 20px; display: grid; gap: 12px; }
.stampword { display: inline-block; justify-self: start; font-family: var(--mono); font-weight: 600; font-size: clamp(26px, 6.5vw, 38px); letter-spacing: .14em;
  color: var(--gold); border: 4px solid var(--gold); padding: 4px 16px; border-radius: 4px; transform: rotate(-4deg); animation: stamp .45s cubic-bezier(.2,1.6,.4,1) both; }
.stampword.ok { color: var(--ok); border-color: var(--ok); }
@keyframes stamp { from { opacity: 0; transform: scale(1.8) rotate(-4deg); } to { opacity: 1; transform: scale(1) rotate(-4deg); } }

.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
.jcard { background: var(--paper); color: var(--paper-ink); border-radius: 3px; padding: 12px 14px; font-size: 14.5px; line-height: 1.45; min-width: 0; }
.jcard .lab { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #8f1f24; margin-bottom: 6px; }
.jcard .case { display: block; font-family: var(--mono); font-size: 11px; opacity: .72; margin-top: 6px; }
.search { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #fff; color: #222; border-radius: 6px; padding: 10px 12px; font-family: var(--mono); font-size: 14px; }
.search .q { flex: 1; min-width: 120px; border-right: 1px solid #ddd; }
.search .q::after { content: "|"; animation: tick 1s steps(1) infinite; margin-left: 1px; }
.search .res { color: #b3000c; font-weight: 600; }

.circlewrap { background: var(--stagebg); border-radius: 8px; padding: 6px; margin: 14px 0; }
.circlewrap svg { display: block; width: 100%; height: auto; }
.spin { transform-origin: 320px 160px; animation: spin 18s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
ul.mine { padding-left: 18px; margin: 0 0 14px; }
ul.mine li { margin-bottom: 6px; }
ul.mine b { color: var(--gold); font-family: var(--mono); font-size: 12.5px; letter-spacing: .06em; }

.law-list { display: grid; gap: 10px; margin: 16px 0; }
.lawrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--paper); color: var(--paper-ink); border-radius: 3px; padding: 12px 14px; }
.lawrow .old { font-size: 15px; line-height: 1.45; }
.lawrow .new { display: none; font-size: 15px; line-height: 1.45; color: #0f5a3a; font-weight: 600; margin-top: 6px; }
.lawrow.done .old { text-decoration: line-through; text-decoration-color: #c4161c; text-decoration-thickness: 2px; color: #7a6a63; }
.lawrow.done .new { display: block; animation: rise .4s ease both; }
.lawrow .tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #8f1f24; display: block; margin-bottom: 4px; }
.strike { background: #c4161c; color: #fff; border: 0; border-radius: 5px; padding: 9px 12px; font: 600 13px var(--mono); letter-spacing: .06em; cursor: pointer; white-space: nowrap; }
.strike:disabled { background: #0f5a3a; cursor: default; }
.strike:focus-visible { outline: 2px solid #1f3f9a; outline-offset: 2px; }
.count { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }

.modalback { position: fixed; inset: 0; background: rgba(40,10,14,.82); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(460px, 100%); background: #fbf6f3; color: #1b1214; border-radius: 10px; padding: 22px 22px 18px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
.modal.inline { margin: 18px 0; box-shadow: none; }
.modal h4 { margin: 0 0 8px; font-size: 18px; }
.modal p { font-size: 14.5px; line-height: 1.5; margin: 0 0 16px; color: #1b1214; }
.modal .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal .agree, .modal .withdraw { width: 100%; border: 0; border-radius: 6px; padding: 12px; font: 600 15px system-ui, sans-serif; cursor: pointer; }
.modal .agree { background: #1b1214; color: #fff; }
.modal .withdraw { background: #fff; color: #1b1214; border: 2px solid #1b1214; }
.modal .agree:focus-visible, .modal .withdraw:focus-visible { outline: 3px solid #c4161c; outline-offset: 2px; }
.modal .fine { font-size: 11px; color: #6b5d60; margin: 10px 0 0; text-align: center; }
.toast { position: fixed; left: 0; right: 0; margin: 0 auto; width: fit-content; bottom: max(20px, env(safe-area-inset-bottom, 0px)); background: var(--fg); color: #5a1c25;
  font-family: var(--mono); font-size: 12.5px; padding: 10px 14px; border-radius: 6px; z-index: 30; animation: rise .3s ease both; max-width: calc(100% - 32px); }

.big { font-family: var(--display); font-size: clamp(40px, 10vw, 72px); line-height: 1.05; margin: 20px 0 12px; }
.big em { font-style: normal; color: var(--gold); }
.srclist p { font-size: 15.5px; margin-bottom: 12px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 560px) {
  body { font-size: 16.5px; }
  .story { padding: 20px 16px 24px; }
  .ledger { grid-template-columns: minmax(0, 1fr); }
  .thread { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .lawrow { grid-template-columns: minmax(0, 1fr); }
}
</style>

<div class="wrap">
  <header class="hud">
    <span class="name">Accordingly</span>
    <nav>
      <button class="linkbtn" id="navMethod" type="button">How it works</button>
      <button class="linkbtn" id="navSources" type="button">Sources</button>
    </nav>
  </header>
  <div class="ledger" id="ledger" hidden></div>
  <div class="thread" id="thread" hidden></div>
  <div class="stage" id="stage"></div>
  <main class="story" id="app" aria-live="polite"></main>
</div>

    ["THE DECREE", "home, or lose property"], ["CONSENT PRESUMED", "Exception 2"], ["BOUND TIGHTER", "sex, then a child"]];
  const pos = nodes.map((_, i) => { const a = -Math.PI / 2 + i * Math.PI / 3; return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; });
  const arcs = pos.map((p, i) => { const q = pos[(i + 1) % 6]; return `<path d="M${p[0]} ${p[1]} A${R} ${R} 0 0 1 ${q[0]} ${q[1]}" fill="none" stroke="#f6bd47" stroke-width="2"/>`; }).join("");
  const boxes = nodes.map((n, i) => { const [x, y] = pos[i]; return `<g><rect x="${x - 75}" y="${y - 22}" width="150" height="44" rx="6" fill="#6d2430" stroke="#f6bd47" stroke-width="1.5"/>
      <text x="${x}" y="${y - 4}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" fill="#fff4ee">${n[0]}</text>
      <text x="${x}" y="${y + 12}" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="11" font-style="italic" fill="#f2d3d3">${esc(n[1])}</text></g>`; }).join("");
  return `<svg viewBox="0 0 640 320" role="img" aria-label="A closed circle of six steps: the yes is caused, made irreversible, her no becomes a fault, the decree, consent presumed, bound tighter, and back to the start">
    <circle class="spin" cx="${cx}" cy="${cy}" r="${R - 30}" fill="none" stroke="#a24c59" stroke-width="1.5" stroke-dasharray="4 8"/>${arcs}${boxes}
    <text x="${cx}" y="${cy - 4}" text-anchor="middle" font-family="Gloock, Georgia, serif" font-size="20" fill="#fff4ee">Consent?</text>
    <text x="${cx}" y="${cy + 20}" text-anchor="middle" font-family="Gloock, Georgia, serif" font-size="20" fill="#f6bd47">Illusory.</text></svg>`;
}
function renderCircle() {
  noStage();
  const line = (k, who) => { const st = FLOW.find(f => f.key === k); const c = st.choices[s.picks[k] ?? 0]; return `${who} ${esc(c.short)}`; };
  const rows = [
    `<li>Meera ${esc(FLOW[0].choices[s.picks.meeraA ?? 0].short)}, then ${esc(FLOW[1].choices[s.picks.meeraB ?? 0].short)}. <b>CAUSED</b></li>`,
    `<li>Nandini ${esc(FLOW[3].choices[s.picks.nandiniA ?? 0].short)}, then ${esc(FLOW[4].choices[s.picks.nandiniB ?? 0].short)}. <b>CONTINUED</b></li>`,
    `<li>Zoya ${esc(FLOW[5].choices[s.picks.zoyaA ?? 0].short)}, then ${esc(FLOW[6].choices[s.picks.zoyaB ?? 0].short)}. <b>COERCED</b></li>`,
    `<li>As judge, you ${esc(FLOW[7].choices[s.picks.judge ?? 0].short)}. <b>NOT ASKED</b></li>`
  ].join("");
  app.innerHTML = `<div class="reveal"><div class="eyebrow">The circle</div><h2>Every path ends where it started</h2>
    <p>You made seven choices. Each one was real, and each led somewhere different:</p><ul class="mine">${rows}</ul>
    <div class="circlewrap">${circleSVG()}</div>
    <p>A yes taken once under pressure, the law treats as forever. When she says no, the law makes her the one at fault. The decree sends her home, and once she is home the law presumes the rest. Consent was never asked, so it could never be withdrawn.</p>
    <p class="note">At every step, Exception 2 created a consent none of these women gave. That is the fourth C: <b>CREATED</b>.</p>
    <div class="foot"><button class="primary" id="next" type="button">Break the circle</button></div></div>`;
  reveal(app.firstElementChild);
  $("next").focus({ preventScroll: true }); $("next").onclick = nextStep;
}
function renderRedline() {
  noStage();
  const n = s.struck.length;
  app.innerHTML = `<div class="reveal"><div class="eyebrow">The redline</div><h2>Break the circle</h2>
    <p>You could not decide anything as a wife, and the statute tied your hands as a judge. Now decide as the lawmaker. Change each rule that keeps the circle turning, and watch the meter.</p>
    <div class="law-list">${REDLINE.map((l, i) => { const d = s.struck.includes(i); return `<div class="lawrow${d ? " done" : ""}" id="row${i}"><div><span class="tag">${esc(l.tag)}</span><div class="old">${esc(l.old)}</div><div class="new">${esc(l.nw)}</div></div>
      <button class="strike" type="button" data-i="${i}" ${d ? "disabled" : ""}>${d ? "Done" : esc(l.tag)}</button></div>`; }).join("")}</div>
    <div class="count" id="count">${n} of ${REDLINE.length} changed</div>
    <div class="foot"><button class="primary" id="next" type="button" ${n < REDLINE.length ? "disabled" : ""}>Ask her again</button><button class="ghost" id="all" type="button">Change all</button></div></div>`;
  reveal(app.firstElementChild);
  app.querySelectorAll(".strike").forEach(b => b.onclick = () => strike(+b.dataset.i));
  $("all").onclick = () => { REDLINE.forEach((_, i) => { if (!s.struck.includes(i)) s.struck.push(i); }); save(); render(); };
  $("next").onclick = nextStep;
  const f = app.querySelector(".strike:not(:disabled)"); (f || $("next")).focus({ preventScroll: true });
}
function strike(i) {
  if (s.struck.includes(i)) return;
  s.struck.push(i); save();
  const row = $("row" + i); row.classList.add("done");
  const b = row.querySelector(".strike"); b.disabled = true; b.textContent = "Done";
  $("count").textContent = `${s.struck.length} of ${REDLINE.length} changed`; hud();
  if (s.struck.length === REDLINE.length) { $("next").disabled = false; $("next").focus({ preventScroll: true }); }
  else { const nx = app.querySelector(".strike:not(:disabled)"); if (nx) nx.focus({ preventScroll: true }); }
}
function renderWithdraw() {
  setStage(scene([door({ x: 70, open: true, accent: "#e8433e" }), door({ x: 258, open: true, accent: "#5f8fe0" }), door({ x: 446, open: true, accent: "#4fb089" }),
    woman({ ...M, x: 130, label: "MEERA" }), woman({ ...N, x: 318, label: "NANDINI" }), woman({ ...Z, x: 506, label: "ZOYA" })], "Three women standing in three open doorways", { lamp: "#fff4ee" }), "Same women, a different law");
  app.innerHTML = `<div class="reveal"><div class="eyebrow">Ask again</div><h2>The same question, asked properly</h2>
    <p>The game began by taking your consent with one button. Under the law you just wrote, the question looks different.</p>
    <div class="modal inline" role="group" aria-labelledby="mh2"><h4 id="mh2">Do you consent to continue?</h4>
      <p>You may say yes. You may say no. You may change your mind at any time.</p>
      <div class="btns"><button class="agree" id="yes" type="button">I AGREE</button><button class="withdraw" id="no" type="button">I WITHDRAW</button></div>
      <p class="fine">Both answers count.</p></div></div>`;
  reveal(app.firstElementChild);
  $("no").focus({ preventScroll: true });
  $("yes").onclick = () => { s.withdrew = false; toast("Consent given. You can still withdraw it later."); nextStep(); };
  $("no").onclick = () => { s.withdrew = true; toast("Consent withdrawn."); nextStep(); };
}
function renderFinal() {
  setStage(scene([woman({ ...M, x: 200, label: "MEERA" }), woman({ ...N, x: 320, label: "NANDINI" }), woman({ ...Z, x: 440, label: "ZOYA" })], "Meera, Nandini and Zoya together in warm light", { lamp: "#ffd27a", floor: "#5a2a1a" }), "Every yes asked again");
  app.innerHTML = `<div class="reveal"><div class="eyebrow">${s.withdrew === false ? "Consent given" : "Consent withdrawn"}</div>
    <div class="big">Consent? <em>Illusory.</em></div>
    <p class="lede">Until the law asks again. You just ${s.withdrew === false ? "said yes, and you could have said no" : "said no, and the law let you"}. Under the law as it stands, Meera, Nandini and Zoya cannot.</p>
    <p>Three laws to strike out. One question to remember: did she consent, to this, now?</p>
    <div class="slip"><div class="head"><span>On the record</span><span>2019 to 2026</span></div>
      <p>The Union of India, defending the marital rape exception: <q>a woman's consent is not obliterated by marriage</q>.<span class="src">${esc(SRC.affidavit)}</span></p>
      <p>From the Supreme Court bench: <q>there is no question of marriage resulting in an extinction of individual autonomy.</q><span class="src">${esc(SRC.bench)}</span></p>
      <p>The challenge to restitution of conjugal rights: pending since 2019.<span class="src">${esc(SRC.ojaswa)}</span></p></div>
    <div class="foot"><button class="ghost" id="again" type="button">Play again</button></div></div>`;
  reveal(app.firstElementChild);
  $("again").onclick = restart;
}

function advance() {
  if (s.screen === "intro") return goStep(0);
  if (s.screen !== "game") return;
  const st = step();
  if (st.type === "round" && s.phase === "scene") { s.picks[st.key] = s.picks[st.key] ?? 0; return goStep(s.i, "outcome"); }
  if (st.type === "redline") { REDLINE.forEach((_, i) => { if (!s.struck.includes(i)) s.struck.push(i); }); }
  if (st.type === "withdraw") s.withdrew = true;
  nextStep();
}
function restart() { s = fresh(); save(); render(); window.scrollTo({ top: 0 }); }

/* ============ OVERLAYS ============ */
function solo(html) {
  noStage(); $("ledger").hidden = $("thread").hidden = true;
  app.innerHTML = `<div class="reveal">${html}<div class="foot"><button class="primary" id="back" type="button">Back to the game</button></div></div>`;
  reveal(app.firstElementChild);
  $("back").onclick = () => render(); $("back").focus({ preventScroll: true });
}
$("navMethod").onclick = () => solo(`<div class="eyebrow">How it works</div><h2>Real choices, fixed outcome</h2>
  <p>You live three marriages from our film, each under a different personal law: Meera under s. 9 of the Hindu Marriage Act, Nandini under s. 22 of the Special Marriage Act, and Zoya in a suit for restitution under Muslim law. Each woman faces two decisions: when she says no, and when the decree arrives.</p>
  <p>Every option leads to a different legal consequence, and every path ends with the same kind of verdict. The meter drains whatever you choose. Then you sit as the judge, hear what other judges have said, see the circle of causation and irreversibility, and rewrite the law yourself.</p>
  <h3>The four Cs</h3>
  <p><b>Caused:</b> the original yes came from family, dowry or economic pressure. <b>Continued:</b> a yes given once is read as live years later. <b>Coerced:</b> the legal process itself pushes her back. <b>Created:</b> the law supplies a consent she never gave.</p>
  <p class="note">Presenter shortcuts: right arrow skips ahead, R restarts. Tap any document to enlarge it.</p>`);
$("navSources").onclick = () => solo(`<div class="eyebrow">Sources</div><h2>Where each consequence comes from</h2>
  <div class="srclist">${Object.values(SRC).map(v => `<p>${esc(v)}</p>`).join("")}
  <p>Judgments quoted on the bench screen, as quoted in Mandal (EPW 2017): ${BENCH.map(b => esc(b.c)).join("; ")}.</p></div>`);

/* ============ KEYS ============ */
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.querySelector(".modalback")) return;
  if (app.querySelector("#back")) return;
  if (s.screen === "game" && step().type === "round" && s.phase === "scene" && ["1", "2", "3"].includes(e.key)) { e.preventDefault(); pick(+e.key - 1); return; }
  if (e.key === "ArrowRight") { e.preventDefault(); if (!(s.screen === "game" && step().type === "final") && s.screen !== "agree") advance(); return; }
  if (e.key === "r" || e.key === "R") restart();
});

/* ============ PERSIST ============ */
function save() { try { window.claude?.hot?.snapshot?.(() => s); } catch (_) {} }
function start(data) { if (data && ["agree", "intro", "game"].includes(data.screen) && typeof data.i === "number") s = { ...fresh(), ...data }; render(); }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
